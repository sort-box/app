[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
arc-swap = "1"
axum = { version = "0.8", features = ["json", "macros"] }
base64 = "0.22"
futures-util = { version = "=0.3.32", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rsa = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["oid"] }
signature = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "0.6", features = ["request-id", "trace", "timeout", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

[dev-dependencies]
http-body-util = "0.1"
mockito = "1"
rand = "0.8"
tower = { version = "0.5", features = ["util"] }
